[project]
name = "agentic-dev"
version = "0.1.0"
description = "Marimo labs for measuring and teaching AI-assisted software engineering"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "clickhouse-connect>=0.9.2",
    "marimo>=0.17.0",
    "python-dotenv>=1.1",
]

[project.scripts]
agentic-dev = "agentic_dev.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_dev"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "integration: requires Docker, Claude Code authentication, network access, and a model call",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
